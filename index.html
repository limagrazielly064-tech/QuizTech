<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Tech - Ranking Unificado</title>
    <!-- Bibliotecas corretas do Firebase v8 (NÃO usar 'import') -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --primary: #3b82f6; --primary-hover: #2563eb; --bg-color: #f8fafc;
            --text-main: #0f172a; --text-muted: #475569; --success: #10b981;
            --error: #ef4444; --card-bg: #ffffff; --gold: #fbbf24;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .app-container { background-color: var(--card-bg); width: 100%; max-width: 600px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 30px; }
        header { text-align: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid #f1f5f9; }
        header h1 { color: var(--primary); font-size: 24px; }
        .screen { display: none; } .screen.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .intro-text, .result-text { text-align: center; margin-bottom: 24px; color: var(--text-muted); line-height: 1.5; }
        .input-name { width: 100%; padding: 14px; margin-bottom: 20px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 16px; outline: none; }
        .btn-primary, .btn-secondary, .btn-danger { display: block; width: 100%; padding: 16px; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        .btn-primary { background-color: var(--primary); } .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: var(--text-muted); } .btn-secondary:hover { background-color: var(--text-main); }
        .btn-danger { background-color: transparent; color: var(--error); border: 2px solid var(--error); padding: 12px; margin-top: 20px; }
        .question-status { font-size: 14px; color: var(--text-muted); margin-bottom: 12px; font-weight: 600; }
        .question-title { font-size: 18px; margin-bottom: 20px; line-height: 1.4; }
        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { padding: 14px; background-color: var(--bg-color); border: 2px solid transparent; border-radius: 8px; font-size: 15px; text-align: left; cursor: pointer; }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { background-color: #d1fae5; border-color: var(--success); }
        .option-btn.wrong { background-color: #fee2e2; border-color: var(--error); }
        .feedback-box { margin-top: 20px; padding: 16px; border-radius: 8px; display: none; }
        .feedback-box.active { display: block; }
        .feedback-box.success { background-color: #d1fae5; color: #065f46; border-left: 4px solid var(--success); }
        .feedback-box.error { background-color: #fee2e2; color: #991b1b; border-left: 4px solid var(--error); }
        .feedback-title { font-weight: bold; margin-bottom: 8px; }
        .btn-next { margin-top: 20px; display: none; }
        .score-display { font-size: 48px; font-weight: bold; color: var(--primary); margin: 20px 0; }
        .ranking-list { list-style: none; margin-bottom: 20px; max-height: 300px; overflow-y: auto; }
        .ranking-item { display: flex; justify-content: space-between; padding: 12px 16px; background-color: var(--bg-color); margin-bottom: 8px; border-radius: 8px; font-weight: 500; }
        .ranking-item:nth-child(1) { background-color: #fef3c7; border-left: 4px solid var(--gold); }
        .ranking-item:nth-child(2) { background-color: #f1f5f9; border-left: 4px solid #94a3b8; }
        .ranking-item:nth-child(3) { background-color: #fff7ed; border-left: 4px solid #fb923c; }
    </style>
</head>
<body>

    <div class="app-container">
        <header><h1>Quiz Tech</h1></header>

        <!-- TELA 1: Início -->
        <div id="start-screen" class="screen active">
            <h2 style="text-align:center; margin-bottom:12px;">Vamos testar?</h2>
            <p class="intro-text">Responda as 10 questões do nosso Quiz de Cidadania Digital.</p>
            <input type="text" id="player-name" class="input-name" placeholder="Digite seu nome para o ranking" autocomplete="off" maxlength="30">
            <button class="btn-primary" onclick="startQuiz()">Começar Quiz</button>
            <button class="btn-secondary" onclick="showRankingScreen()">Ver Ranking da Turma</button>
        </div>

        <!-- TELA 2: Perguntas -->
        <div id="quiz-screen" class="screen">
            <div class="question-status">Pergunta <span id="current-question">1</span> de <span id="total-questions">10</span></div>
            <h2 class="question-title" id="question-text">Texto da pergunta?</h2>
            <div class="options-list" id="options-container"></div>
            <div class="feedback-box" id="feedback-container">
                <div class="feedback-title" id="feedback-title">Correto!</div>
                <div class="feedback-text" id="feedback-text">Explicação aqui...</div>
            </div>
            <button class="btn-primary btn-next" id="next-btn" onclick="nextQuestion()">Próxima Pergunta</button>
        </div>

        <!-- TELA 3: Resultado -->
        <div id="result-screen" class="screen">
            <h2 style="text-align:center; margin-bottom:8px;">Fim do Quiz!</h2>
            <div class="result-text" style="text-align:center;">
                <p>Muito bem, <span id="display-player-name" style="font-weight:bold;"></span>! Sua pontuação foi:</p>
                <div class="score-display"><span id="score">0</span>/10</div>
                <p id="score-message">Parabéns por completar o desafio!</p>
            </div>
            <button class="btn-primary" onclick="showRankingScreen()">Ver Ranking Global</button>
            <button class="btn-secondary" onclick="restartQuiz()">Novo Jogador</button>
        </div>

        <!-- TELA 4: Ranking -->
        <div id="ranking-screen" class="screen">
            <h2 style="text-align:center; margin-bottom:20px;">🏆 Ranking Global da Turma</h2>
            <ul class="ranking-list" id="ranking-list-container"></ul>
            <button class="btn-primary" onclick="restartQuiz()">Voltar ao Início</button>
            <button class="btn-danger" onclick="clearRanking()">Limpar Ranking (Apenas Professores)</button>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO FIREBASE (Corrigida sem 'import' e com o ID certo)
        const firebaseConfig = {
            apiKey: "AIzaSyDIDK0c2lpq4FDmd2NFc3AXvBFWpfMvbIw",
            authDomain: "quiztech-2a98f.firebaseapp.com",
            databaseURL: "https://quiztech-2a98f-default-rtdb.firebaseio.com",
            projectId: "quiztech-2a98f",
            storageBucket: "quiztech-2a98f.appspot.com", // atualizado do seu print
            messagingSenderId: "580501924410",
            appId: "1:580501924410:web:3651ad068aebe32cc66303"
        };

        // Inicializa o Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const questions = [
            {
                question: "1. Qual das opções abaixo é a senha MAIS segura para criar em uma rede social?",
                options: ["Sua data de nascimento.", "A palavra 'senha123'.", "Uma mistura de letras, números e símbolos.", "O nome do seu filho."],
                correctAnswer: 2, explanation: "Senhas fortes precisam de caracteres variados para que robôs e golpistas não consigam adivinhar."
            },
            {
                question: "2. Para que serve a 'Verificação em Duas Etapas' (o famoso PIN) no WhatsApp?",
                options: ["Para economizar a bateria do celular.", "É uma senha extra que impede que clorem seu número em outro aparelho.", "Para permitir que duas pessoas usem a mesma conta.", "Para não apagar fotos antigas."],
                correctAnswer: 1, explanation: "O 2FA cria uma barreira extra. Mesmo se o golpista interceptar seu SMS, ele não saberá seu PIN de 6 dígitos."
            },
            {
                question: "3. Você recebe um SMS: 'Seu CPF foi bloqueado! Pague R$ 50 via PIX neste link'. O que fazer?",
                options: ["Clicar no link imediatamente e pagar.", "Ignorar a mensagem, não clicar e bloquear o número.", "Encaminhar para todos os amigos para alertá-los enviando o link.", "Responder com seus dados bancários."],
                correctAnswer: 1, explanation: "Isso é 'Phishing' (pescaria de dados). Órgãos oficiais nunca cobram taxas por SMS para desbloqueios."
            },
            {
                question: "4. Você recebe um e-mail com um arquivo anexado dizendo 'Sua Fatura Venceu', mas você não comprou nada. O que fazer?",
                options: ["Baixar o arquivo para ver do que se trata.", "Encaminhar para o banco conferir.", "Apagar o e-mail sem baixar nada, pois pode ser um vírus.", "Responder o e-mail xingando a pessoa."],
                correctAnswer: 2, explanation: "Baixar anexos desconhecidos é a forma mais comum de instalar vírus (malwares) que roubam senhas do seu celular ou computador."
            },
            {
                question: "5. Você vai fazer uma compra em uma loja virtual desconhecida. Como verificar se é segura?",
                options: ["Verificar se o endereço do site tem um cadeado e começa com 'https://'.", "Comprar de olhos fechados se for muito barato.", "Acreditar na loja só porque viu propaganda no Instagram.", "Mandar dados do cartão por e-mail."],
                correctAnswer: 0, explanation: "Sites seguros usam conexão criptografada (HTTPS e o cadeado). Desconfie sempre de promoções milagrosas."
            },
            {
                question: "6. Você viu uma notícia dizendo que um chá cura uma doença grave em 1 dia. O que fazer antes de repassar?",
                options: ["Compartilhar nos grupos de família, pois pode ajudar alguém.", "Pesquisar no Google em sites de jornalismo confiáveis antes de acreditar.", "Tomar o chá imediatamente.", "Acreditar se quem enviou foi um parente de confiança."],
                correctAnswer: 1, explanation: "Fake News costumam apelar para o emocional e curas mágicas. Sempre verifique em fontes oficiais e portais de notícias."
            },
            {
                question: "7. Você vai viajar em família e a casa ficará vazia por 10 dias. Como postar nas redes sociais de forma segura?",
                options: ["Postar no aeroporto dizendo 'Tchau, casa vazia!'.", "Marcar a localização exata do hotel em modo público.", "Postar as fotos apenas quando voltar de viagem ou no modo 'só para amigos'.", "Publicar fotos mostrando a fachada de casa."],
                correctAnswer: 2, explanation: "Criminosos monitoram redes sociais abertas para saber quando as casas estão vazias. Limite sua exposição!"
            },
            {
                question: "8. Você está no shopping usando a rede de 'Wi-Fi Grátis' do local. O que você NÃO deve fazer conectado a ela?",
                options: ["Acessar o WhatsApp para falar com a família.", "Ler notícias em um portal.", "Acessar o aplicativo do seu banco para pagar um boleto.", "Olhar fotos no Instagram."],
                correctAnswer: 2, explanation: "Redes públicas de Wi-Fi não são seguras e podem ser interceptadas. Nunca acesse bancos ou digite senhas financeiras nelas."
            },
            {
                question: "9. Você recebe um áudio perfeito de um famoso político falando algo criminoso. Sabendo das novas tecnologias, o que pode ser?",
                options: ["É a verdade absoluta, voz não se falsifica.", "Pode ser um 'Deepfake' gerado por IA para enganar eleitores.", "Um defeito no microfone do celular dele.", "Um áudio original de estúdio."],
                correctAnswer: 1, explanation: "A Inteligência Artificial (Deepfake) já consegue clonar vozes perfeitamente a partir de poucos segundos de áudio original."
            },
            {
                question: "10. Qual é a postura correta ao utilizar ferramentas de Inteligência Artificial (como o ChatGPT) para os estudos?",
                options: ["Acreditar 100% no que ela escreve, robôs não erram.", "Usar como um auxílio e base, mas sempre revisando com senso crítico.", "Copiar os textos sem ler e entregar para o professor.", "Proibir o uso, pois toda IA é perigosa."],
                correctAnswer: 1, explanation: "A IA é uma aliada poderosa, mas pode sofrer 'alucinações' (inventar dados). A revisão humana e o senso crítico são insubstituíveis."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let currentPlayer = "";

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const rankingScreen = document.getElementById('ranking-screen');
        const optionsContainer = document.getElementById('options-container');
        const feedbackContainer = document.getElementById('feedback-container');
        const nextBtn = document.getElementById('next-btn');

        function startQuiz() {
            const nameInput = document.getElementById('player-name').value.trim();
            if (!nameInput) { alert("Digite seu nome para participar do ranking!"); return; }
            currentPlayer = nameInput;
            startScreen.classList.remove('active');
            quizScreen.classList.add('active');
            currentQuestionIndex = 0;
            score = 0;
            loadQuestion();
        }

        function loadQuestion() {
            nextBtn.style.display = 'none';
            feedbackContainer.classList.remove('active', 'success', 'error');
            optionsContainer.innerHTML = '';
            
            const currentQ = questions[currentQuestionIndex];
            document.getElementById('current-question').innerText = currentQuestionIndex + 1;
            document.getElementById('question-text').innerText = currentQ.question;

            currentQ.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.innerText = option;
                button.onclick = () => selectOption(index, button);
                optionsContainer.appendChild(button);
            });
        }

        function selectOption(selectedIndex, selectedButton) {
            const currentQ = questions[currentQuestionIndex];
            const isCorrect = selectedIndex === currentQ.correctAnswer;
            const allButtons = optionsContainer.querySelectorAll('.option-btn');

            allButtons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === currentQ.correctAnswer) btn.classList.add('correct');
            });

            feedbackContainer.classList.add('active');
            document.getElementById('feedback-text').innerText = currentQ.explanation;

            if (isCorrect) {
                selectedButton.classList.add('correct');
                feedbackContainer.className = 'feedback-box active success';
                document.getElementById('feedback-title').innerText = "🎉 Resposta Correta!";
                score++;
            } else {
                selectedButton.classList.add('wrong');
                feedbackContainer.className = 'feedback-box active error';
                document.getElementById('feedback-title').innerText = "❌ Resposta Incorreta!";
            }

            nextBtn.style.display = 'block';
            if (currentQuestionIndex === questions.length - 1) { nextBtn.innerText = "Salvar Pontuação na Nuvem"; }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                saveScoreToFirebase();
                showResult();
            }
        }

        function saveScoreToFirebase() {
            database.ref('ranking').push({
                name: currentPlayer,
                score: score,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        function showResult() {
            quizScreen.classList.remove('active');
            resultScreen.classList.add('active');
            document.getElementById('display-player-name').innerText = currentPlayer;
            document.getElementById('score').innerText = score;
        }

        function showRankingScreen() {
            startScreen.classList.remove('active');
            resultScreen.classList.remove('active');
            rankingScreen.classList.add('active');
            
            const rankingList = document.getElementById('ranking-list-container');
            rankingList.innerHTML = '<li style="text-align:center;">Carregando ranking da nuvem...</li>';
            
            database.ref('ranking').orderByChild('score').on('value', (snapshot) => {
                rankingList.innerHTML = '';
                let players = [];
                
                snapshot.forEach((childSnapshot) => {
                    players.push(childSnapshot.val());
                });

                players.sort((a, b) => {
                    if (b.score === a.score) return a.timestamp - b.timestamp;
                    return b.score - a.score;
                });

                if (players.length === 0) {
                    rankingList.innerHTML = '<li style="text-align:center; color:#64748b;">Ninguém jogou ainda.</li>';
                    return;
                }

                players.forEach((player, index) => {
                    const li = document.createElement('li');
                    li.className = 'ranking-item';
                    let medal = `${index + 1}º `;
                    if (index === 0) medal = '🥇 ';
                    if (index === 1) medal = '🥈 ';
                    if (index === 2) medal = '🥉 ';

                    li.innerHTML = `
                        <span class="rank-name">${medal} ${player.name}</span>
                        <span class="rank-score">${player.score}/10 pts</span>
                    `;
                    rankingList.appendChild(li);
                });
            });
        }

        function clearRanking() {
            const senha = prompt("Atenção (Área Restrita): Digite a senha para limpar o banco de dados online:");
            if (senha === "admin") {
                if (confirm("Você tem certeza que deseja apagar permanentemente todas as notas da turma no servidor?")) {
                    database.ref('ranking').remove().then(() => {
                        alert("Ranking limpo com sucesso!");
                    });
                }
            } else if (senha !== null) {
                alert("Senha incorreta.");
            }
        }

        function restartQuiz() {
            document.getElementById('player-name').value = '';
            rankingScreen.classList.remove('active');
            resultScreen.classList.remove('active');
            startScreen.classList.add('active');
        }
    </script>
</body>
</html>
